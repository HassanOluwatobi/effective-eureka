name: Daily log
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add today's line
        run: |
          if [ "$(date -u +%Y-%m)" != "2026-11" ]; then echo "Outside November, skipping"; exit 0; fi
          git config user.name "HassanOluwatobi"
          git config user.email "103212535+HassanOluwatobi@users.noreply.github.com"
          echo "- $(date -u +%F)" >> log.md
          git add log.md
          git commit -m "Log $(date -u +%F)"
          git push
